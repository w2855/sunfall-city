<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunfall City</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0b1a; overflow: hidden; }
  canvas#game { display: block; width: 100vw; height: 100vh; }
  #menu {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center;
    background: linear-gradient(180deg, rgba(13,10,26,0.97) 0%, rgba(32,22,56,0.94) 55%, rgba(13,10,26,0.97) 100%);
    color: #eceaf6;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    transition: opacity 0.5s ease;
  }
  #menu.hidden { opacity: 0; pointer-events: none; }
  .title {
    margin: 0;
    font-size: clamp(44px, 9vw, 92px);
    font-weight: 800;
    letter-spacing: 12px;
    color: #ffd166;
    text-shadow: 0 0 30px rgba(255,209,102,0.35), 0 6px 18px rgba(0,0,0,0.6);
  }
  .title .pink { color: #ef476f; }
  .tagline { margin: 0; font-size: 12px; letter-spacing: 3px; color: #b7b3cf; }
  #enter {
    margin-top: 10px;
    background: #ffd166;
    color: #1a1633;
    border: none;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 3px;
    padding: 14px 44px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(255,209,102,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    font-family: inherit;
  }
  #enter:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 36px rgba(255,209,102,0.65); }
  .controls {
    list-style: none;
    padding: 0; margin: 14px 0 0;
    display: grid; grid-template-columns: repeat(3, auto);
    gap: 8px 28px;
    font-size: 12px; letter-spacing: 1px;
    color: #9aa0b5;
  }
  .controls b { color: #eceaf6; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="menu">
  <h1 class="title">SUNFALL <span class="pink">CITY</span></h1>
  <p class="tagline">AN OPEN-WORLD CRIME STORY · RUNS OFFLINE · SAVES IN YOUR BROWSER</p>
  <button id="enter">ENTER THE CITY</button>
  <ul class="controls">
    <li><b>WASD</b> move / drive</li>
    <li><b>Mouse</b> look / aim</li>
    <li><b>Shift</b> sprint / handbrake</li>
    <li><b>E</b> enter / exit cars</li>
    <li><b>Click</b> shoot when armed</li>
    <li><b>Esc</b> pause</li>
  </ul>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
